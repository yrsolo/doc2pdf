name: deploy-serverless-container

on:
  workflow_dispatch:
    inputs:
      image_tag:
        description: "Image tag to deploy (defaults to current commit SHA)"
        required: false
        type: string

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Write YC credentials
        run: |
          echo '${{ secrets.YC_SA_JSON_CREDENTIALS }}' > yc-key.json

      - name: Install YC CLI
        run: |
          curl -sSL https://storage.yandexcloud.net/yandexcloud-yc/install.sh | bash
          echo "$HOME/yandex-cloud/bin" >> $GITHUB_PATH

      - name: Auth YC CLI
        run: |
          yc config profile create ci || true
          yc config set service-account-key yc-key.json
          yc config set folder-id "${{ secrets.YC_FOLDER_ID }}"

      - name: Compute image ref
        run: |
          TAG="${{ github.event.inputs.image_tag }}"
          if [ -z "$TAG" ]; then TAG="${{ github.sha }}"; fi
          IMAGE="cr.yandex/${{ secrets.YC_REGISTRY_ID }}/${{ secrets.YC_DOC_CONVERTER_IMAGE_NAME }}:${TAG}"
          echo "IMAGE=$IMAGE" >> $GITHUB_ENV

      - name: Deploy revision
        run: |
          yc serverless container revision deploy             --container-id "${{ secrets.YC_DOC_CONVERTER_CONTAINER_ID }}"             --image "$IMAGE"             --cores 1             --memory 2GB             --execution-timeout 120s             --concurrency 1             --environment PORT=8080,GOTENBERG_BASE_URL=http://localhost:3000,SHARED_TOKEN=${{ secrets.DOC_CONVERTER_SHARED_TOKEN }}

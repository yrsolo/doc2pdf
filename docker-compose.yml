version: "3.9"

services:
  app:
    build: .
    environment:
      PORT: "8080"
      GOTENBERG_BASE_URL: "http://gotenberg:3000"
      SHARED_TOKEN: "local-dev-token"
    ports:
      - "8080:8080"
    depends_on:
      - gotenberg

  gotenberg:
    image: gotenberg/gotenberg:8
    ports:
      - "3000:3000"
